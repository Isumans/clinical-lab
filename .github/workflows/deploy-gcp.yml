name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published LabSync image version (for example, 0.3.2)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Published LabSync image version"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy LabSync ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7

      - name: Validate release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the form 0.3.2 or v0.3.2." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Copy deployment script through IAP
        run: |
          gcloud compute scp scripts/deploy-release.sh \
            "${{ vars.GCP_VM_NAME }}:/tmp/labsync-deploy.sh" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --tunnel-through-iap \
            --quiet

      - name: Deploy and verify release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo -u isuma bash /tmp/labsync-deploy.sh '${VERSION}' && rm -f /tmp/labsync-deploy.sh"
