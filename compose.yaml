name: labsync

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      LABSYNC_APP_NAME: LabSync API
      LABSYNC_APP_VERSION: 0.1.0
      LABSYNC_DEBUG: "false"
      LABSYNC_DATABASE_URL: ${LABSYNC_DATABASE_URL:?Set LABSYNC_DATABASE_URL in the root .env file}
      LABSYNC_JWT_SECRET_KEY: ${LABSYNC_JWT_SECRET_KEY:?Set LABSYNC_JWT_SECRET_KEY in the root .env file}
      LABSYNC_JWT_ALGORITHM: HS256
      LABSYNC_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      LABSYNC_CORS_ORIGINS: ${LABSYNC_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  postgres_data:
